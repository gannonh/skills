name: Add OKF viz command

on:
  push:
    branches:
      - agent/improve-okf-documentation-workflows
    paths:
      - .github/workflows/add-okf-viz-command.yml

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/improve-okf-documentation-workflows
          fetch-depth: 0

      - name: Add viz workflow and eval
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          skill_path = Path("okf/SKILL.md")
          text = skill_path.read_text(encoding="utf-8")

          text = text.replace(
              "description: Create, read, audit, validate, and maintain Open Knowledge Format documentation bundles in repositories. Use this skill when the user asks for /okf, OKF, Open Knowledge Format, docs-as-knowledge, reading project context from docs, converting a documentation repository into an agent-readable bundle, auditing documentation quality, updating durable documentation after work, or adding AGENTS.md instructions for agents to consume and maintain the bundle. Supports /okf read, /okf audit, /okf init, /okf update, and /okf validate workflows.",
              "description: Create, read, audit, visualize, validate, and maintain Open Knowledge Format documentation bundles in repositories. Use this skill when the user asks for /okf, OKF, Open Knowledge Format, docs-as-knowledge, reading project context from docs, converting a documentation repository into an agent-readable bundle, auditing documentation quality, generating an interactive knowledge graph, updating durable documentation after work, or adding AGENTS.md instructions for agents to consume and maintain the bundle. Supports /okf read, /okf audit, /okf init, /okf update, /okf validate, and /okf viz workflows.",
          )
          text = text.replace(
              "Use this skill to read, audit, initialize, update, or validate an Open Knowledge Format bundle.",
              "Use this skill to read, audit, initialize, update, validate, or visualize an Open Knowledge Format bundle.",
          )
          text = text.replace(
              "python <skill-dir>/scripts/validate_okf.py <repo-root> --level editorial --strict-links\n```",
              "python <skill-dir>/scripts/validate_okf.py <repo-root> --level editorial --strict-links\n```\n\nGenerate an interactive graph viewer with:\n\n```bash\npython <skill-dir>/scripts/visualize_okf.py <repo-root>\n```",
          )
          text = text.replace("The skill has five workflows:", "The skill has six workflows:")
          text = text.replace(
              "- `/okf validate`: run conformance, repository, or editorial checks.",
              "- `/okf validate`: run conformance, repository, or editorial checks.\n- `/okf viz`: render the bundle as an interactive HTML knowledge graph.",
          )

          viz_section = '''## `/okf viz` workflow

Use this read-only workflow when the user asks to visualize, browse, or inspect the OKF link graph.

1. Locate the bundle.
   - Use the named bundle root, otherwise `./docs`.
   - Do not rewrite concepts, indexes, logs, or frontmatter as part of visualization.

2. Generate the viewer.

   ```bash
   python <skill-dir>/scripts/visualize_okf.py <repo-root>
   ```

   The default output is `<bundle>/viz.html`. Optional arguments:

   ```bash
   python <skill-dir>/scripts/visualize_okf.py \\
     --bundle path/to/bundle \\
     --out /tmp/knowledge.html \\
     --name "Knowledge Base"
   ```

3. Report what was generated.
   - Give the output path and the concept, edge, and warning counts.
   - Mention that the HTML contains the bundle data and application code in one file, while Cytoscape.js and marked load from jsDelivr when the page opens.
   - Treat skipped malformed concepts as warnings rather than silently omitting them.
   - Do not commit `viz.html` unless the user asks or the repository already treats generated viewers as versioned artifacts.

The viewer provides a force-directed concept graph, type colors, search, type filtering, selectable layouts, rendered Markdown details, v0.2 status/trust/freshness signals, internal concept navigation, and backlinks. It resolves both bundle-relative absolute links such as `/guides/setup.md` and ordinary relative links.

'''
          marker = "## AGENTS.md snippet"
          if viz_section not in text:
              text = text.replace(marker, viz_section + marker)

          start = text.index("## Helper script")
          end = text.index("## Before finishing")
          helper = '''## Helper scripts

`scripts/validate_okf.py` supports:

- OKF v0.2 conformance checks
- repository profiles without forcing a fixed taxonomy
- provenance, trust, lifecycle, and Attested Computation shape checks
- optional strict link validation
- editorial warnings for freshness, legacy fields, duplicate titles, and orphaned concepts

`scripts/visualize_okf.py` supports:

- a single interactive HTML output file with embedded bundle data and viewer code
- force-directed and alternate Cytoscape.js layouts
- search and concept-type filtering
- rendered Markdown concept details
- v0.2 status, trust-tier, provenance, and freshness display
- graph edges and in-view navigation for absolute and relative Markdown concept links
- computed backlinks and warning output for malformed concepts

'''
          text = text[:start] + helper + text[end:]
          text = text.replace(
              "- validation and existing docs checks were run",
              "- validation and existing docs checks were run\n- visualization output was generated only when requested and was not committed unintentionally",
          )
          skill_path.write_text(text, encoding="utf-8")

          eval_path = Path("okf/evals/evals.json")
          data = json.loads(eval_path.read_text(encoding="utf-8"))
          if not any(item.get("id") == 9 for item in data["evals"]):
              data["evals"].append({
                  "id": 9,
                  "prompt": "Use /okf viz on a documentation bundle that contains absolute bundle-relative links, ordinary relative links, v0.2 lifecycle and trust metadata, and one malformed Markdown concept. Write the viewer to a custom output path.",
                  "expected_output": "Runs the bundled visualization helper with the requested bundle and output paths, produces a single interactive HTML graph with concepts, directed links, search, filtering, layouts, details, backlinks, and v0.2 status/trust/freshness signals, resolves absolute and relative concept links, reports counts and the malformed-concept warning, and does not modify or commit the bundle unless asked.",
                  "files": [],
              })
          eval_path.write_text(json.dumps(data, indent=2) + "\n", encoding="utf-8")
          PY

      - name: Run OKF tests
        run: |
          python -m pip install --quiet pytest pyyaml
          pytest -q okf/tests

      - name: Commit tested changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add okf/SKILL.md okf/evals/evals.json
          git commit -m 'Add /okf viz workflow'
          git push origin HEAD:agent/improve-okf-documentation-workflows
