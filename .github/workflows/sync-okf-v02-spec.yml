name: Sync OKF v0.2 spec

on:
  push:
    branches:
      - agent/improve-okf-documentation-workflows
    paths:
      - .github/workflows/sync-okf-v02-spec.yml

permissions:
  contents: write

jobs:
  sync-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/improve-okf-documentation-workflows
          fetch-depth: 0

      - name: Mirror official OKF v0.2 specification
        run: |
          curl -fsSL \
            https://raw.githubusercontent.com/GoogleCloudPlatform/knowledge-catalog/main/okf/SPEC.md \
            -o okf/references/SPEC.md
          grep -F '**Version 0.2**' okf/references/SPEC.md

      - name: Run validator tests
        run: |
          python -m pip install --quiet pytest pyyaml
          pytest -q okf/tests/test_validate_okf.py

      - name: Commit mirrored specification
        run: |
          if git diff --quiet -- okf/references/SPEC.md; then
            echo 'Specification already current.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add okf/references/SPEC.md
          git commit -m 'Sync OKF v0.2 specification'
          git push origin HEAD:agent/improve-okf-documentation-workflows
